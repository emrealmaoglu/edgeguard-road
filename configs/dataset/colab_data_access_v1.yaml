      archive_directory: private_inputs
      prepared_directory: datasets/cityscapes/fine/v1
      manifest_file: manifests/cityscapes/fine/v1/dataset_manifest.json
      split_file: manifests/cityscapes/fine/v1/split-policy-v1/policy_selected_split.json
