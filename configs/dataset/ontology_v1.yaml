schema_version: "1.0"
ontology_version: edgeguard-ontology-v1
ontology_status: provisional

semantic_cityscapes19:
  ignore_id: 255
  classes:
    - {id: 0, name: road}
    - {id: 1, name: sidewalk}
    - {id: 2, name: building}
    - {id: 3, name: wall}
    - {id: 4, name: fence}
    - {id: 5, name: pole}
    - {id: 6, name: traffic_light}
    - {id: 7, name: traffic_sign}
    - {id: 8, name: vegetation}
    - {id: 9, name: terrain}
    - {id: 10, name: sky}
    - {id: 11, name: person}
    - {id: 12, name: rider}
    - {id: 13, name: car}
    - {id: 14, name: truck}
    - {id: 15, name: bus}
    - {id: 16, name: train}
    - {id: 17, name: motorcycle}
    - {id: 18, name: bicycle}

known_detection10:
  ignore_id: null
  classes:
    - {id: 0, name: person}
    - {id: 1, name: rider}
    - {id: 2, name: car}
    - {id: 3, name: truck}
    - {id: 4, name: bus}
    - {id: 5, name: train}
    - {id: 6, name: motorcycle}
    - {id: 7, name: bicycle}
    - {id: 8, name: traffic_light}
    - {id: 9, name: traffic_sign}

ood_binary:
  ignore_id: 255
  classes:
    - {id: 0, name: id}
    - {id: 1, name: anomaly}

risk_operational:
  ignore_id: null
  classes:
    - {id: 0, name: low}
    - {id: 1, name: medium}
    - {id: 2, name: high}

source_class_policy:
  unmapped_action: reject
  ignored_source_classes: []
  unsupported_source_classes: []
  reason: The reviewed BDD100K detection vocabulary maps all ten expected names; any unlisted runtime class is an error pending human review.

source_mappings:
  - source_dataset: BDD100K
    source_task: object_detection
    source_id: null
    source_name: pedestrian
    project_namespace: known_detection10
    project_id: 0
    project_name: person
    action: map
    reason: Canonicalize the BDD100K pedestrian category as person.
    mapping_version: bdd100k-detection-to-known_detection10-v1
  - source_dataset: BDD100K
    source_task: object_detection
    source_id: null
    source_name: rider
    project_namespace: known_detection10
    project_id: 1
    project_name: rider
    action: map
    reason: Preserve the rider category.
    mapping_version: bdd100k-detection-to-known_detection10-v1
