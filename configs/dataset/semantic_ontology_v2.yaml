schema_version: "2.0"
ontology_version: edgeguard-semantic-cityscapes19-v2
ignore_id: 255
classes:
  - {id: 0, name: road}
  - {id: 1, name: sidewalk}
  - {id: 2, name: building}
  - {id: 3, name: wall}
  - {id: 4, name: fence}
  - {id: 5, name: pole}
  - {id: 6, name: traffic_light}
  - {id: 7, name: traffic_sign}
  - {id: 8, name: vegetation}
  - {id: 9, name: terrain}
  - {id: 10, name: sky}
  - {id: 11, name: person}
  - {id: 12, name: rider}
  - {id: 13, name: car}
  - {id: 14, name: truck}
  - {id: 15, name: bus}
  - {id: 16, name: train}
  - {id: 17, name: motorcycle}
  - {id: 18, name: bicycle}
sources:
  cityscapes:
    mapping_version: cityscapes-trainids-v1
    mask_encoding: canonical_train_id
  bdd100k:
    mapping_version: bdd100k-cityscapes19-v1
    mask_encoding: canonical_train_id
  idd20k:
    mapping_version: autonue-source-id-to-cityscapes19-v1
    mask_encoding: source_id
    source_reference: https://github.com/AutoNUE/public-code/blob/312a6ba2219a39fe8b105e44ad0612079249bad8/helpers/anue_labels.py
    map:
      0: 0
      3: 1
      6: 11
      8: 12
      9: 17
      10: 18
      12: 13
      13: 14
      14: 15
      17: 16
      20: 3
      21: 4
      24: 7
      25: 6
      26: 5
      29: 2
      32: 8
      33: 10
    ignore_source_ids: [1, 2, 4, 5, 7, 11, 15, 16, 18, 19, 22, 23, 27, 28, 30, 31, 34, 35, 36, 37, 38, 39, 255]
    policy: Only exact semantic matches are mapped; fallback, autorickshaw, animal, curb, billboard, bridge, tunnel, group and void labels are ignored.
  acdc:
    mapping_version: acdc-cityscapes19-v1
    mask_encoding: canonical_train_id
  wilddash2:
    mapping_version: official-server-protocol-v1
    mask_encoding: server_only
  muses:
    mapping_version: muses-cityscapes19-v1
    mask_encoding: canonical_train_id
  kitti:
    mapping_version: kitti-cityscapes19-v1
    mask_encoding: canonical_train_id
  a2d2:
    mapping_version: a2d2-rgb-to-cityscapes19-v1
    mask_encoding: rgb_color
    mapping_status: phase2_proposal_not_training_frozen
    mapping_file: configs/dataset/a2d2_to_cityscapes19_v1.yaml
