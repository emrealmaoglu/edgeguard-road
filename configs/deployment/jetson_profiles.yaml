schema_version: "1.0"
status: contract_only_requires_jetson_measurement
common:
  preprocessing_equivalence_required: true
  onnx_checker_required: true
  onnx_numerical_validation_required: true
  tensorrt_parser_required: true
  postprocessing_equivalence_required: true
  warmup_iterations: 50
  benchmark_iterations: 500
  latency_percentiles: [50, 90, 95, 99]
  measure: [throughput, memory, power, thermals, throttling, failures]
  engine_identity_required: true
profiles:
  A_accuracy:
    model_assignment: null
    precision_candidates: [fp32, fp16]
    priority: accuracy
  B_balanced:
    model_assignment: null
    precision_candidates: [fp16, fp32]
    priority: balanced
  C_edge_real_time:
    model_assignment: null
    precision_candidates: [fp16, int8_optional]
    priority: latency
int8:
  enabled: false
  requires_calibration_dataset_identity: true
  requires_accuracy_retention_evidence: true
assignment_gate: real_numerical_and_sustained_jetson_measurement
