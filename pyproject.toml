[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeguard-road"
version = "0.1.0"
description = "CPU-first research foundation for EdgeGuard-Road"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "EdgeGuard-Road project" }]
dependencies = [
  "numpy>=1.24,<3",
  "Pillow>=10,<13",
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "ruff>=0.5,<1",
  "types-Pillow>=10,<13",
  "types-PyYAML>=6,<7",
]
rescue = [
  "matplotlib>=3.8,<4",
  "onnx>=1.16,<2",
  "onnxruntime>=1.18,<2",
  "optuna>=4,<5",
  "streamlit>=1.40,<2",
]
colab = [
  "matplotlib>=3.8,<4",
  "onnx>=1.16,<2",
  "onnxruntime>=1.18,<2",
  "optuna>=4,<5",
  "streamlit>=1.40,<2",
]
jetson = []

[project.scripts]
edgeguard = "edgeguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["mmengine.*", "mmseg.*", "streamlit", "transformers.*", "ultralytics.*"]
ignore_missing_imports = true
