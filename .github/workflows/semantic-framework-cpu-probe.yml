name: Semantic framework CPU probe

on:
  workflow_dispatch:
  push:
    branches:
      - feat/first-vertical-slice
    paths:
      - .github/workflows/semantic-framework-cpu-probe.yml
      - scripts/dev/**
      - scripts/train/**
      - src/edgeguard/**
      - configs/training/segmentation/**
      - tests/**

permissions:
  contents: read

jobs:
  linux-cpu-probe:
    name: Linux x86 CPU five-model probe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Probe exact Colab lock imports
        if: github.event_name == 'workflow_dispatch'
        env:
          MPLBACKEND: module://matplotlib_inline.backend_inline
          UV_CACHE_DIR: /tmp/host-uv-0.11.19
          UV_PYTHON: /tmp/host-python
          VIRTUAL_ENV: /tmp/host-virtualenv
        run: |
          probe_root="${RUNNER_TEMP}/edgeguard-colab"
          mkdir -p "${probe_root}"
          python scripts/bootstrap_colab_runtime.py \
            --project-root "${GITHUB_WORKSPACE}" \
            --project-commit "$(git rev-parse HEAD)" \
            --content-root "${probe_root}" \
            --runtime-root "${probe_root}/edgeguard-runtime" \
            --checkout-root "${probe_root}/edgeguard-checkouts" \
            --cache-root "${probe_root}/edgeguard-cache" \
            --log "${probe_root}/bootstrap.log" \
            --output "${probe_root}/bootstrap-receipt.json"
          PROBE_ROOT="${probe_root}" python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          from scripts.run_colab_master import _runtime_environment

          root = Path(os.environ["PROBE_ROOT"])
          runtime = root / "edgeguard-runtime/bin/python"
          uv = Path(
              __import__("json").loads(
                  (root / "bootstrap-receipt.json").read_text(encoding="utf-8")
              )["uv"]["path"]
          )
          environment = _runtime_environment(
              project_root=Path.cwd(),
              cache_root=root / "edgeguard-cache",
              runtime_python=runtime,
              uv_executable=uv,
          )
          probe = (
              "from pathlib import Path; "
              "from scripts.train.install_semantic_stack import _environment_probe; "
              f"print(_environment_probe(Path({str(runtime)!r}), "
              f"Path({str(root / 'edgeguard-checkouts/mmsegmentation')!r}), "
              "require_cuda=False))"
          )
          subprocess.run([str(runtime), "-c", probe], check=True, env=environment)
          subprocess.run(
              [
                  str(runtime),
                  "-c",
                  "import pkg_resources; from mmengine.runner import Runner; "
                  "print('pkg_resources and MMEngine runner: OK')",
              ],
              check=True,
              env=environment,
          )
          assert environment["MPLBACKEND"] == "Agg"
          assert environment["UV_CACHE_DIR"] == str(root / "edgeguard-cache/uv")
          assert "VIRTUAL_ENV" not in environment
          PY
      - name: Install CPU framework dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install \
            torch==2.5.1 torchvision==0.20.1 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            mmengine==0.10.7 mmcv-lite==2.1.0 \
            addict==2.4.0 packaging==24.2 prettytable==3.16.0 \
            termcolor==3.1.0 tqdm==4.67.1 yapf==0.43.0 \
            matplotlib==3.10.5 scipy==1.16.1 terminaltables==3.1.10
          python -m pip install ftfy==6.3.1 regex==2024.11.6
          python -m pip install \
            onnx==1.18.0 onnxruntime==1.22.1 onnxscript==0.7.1 \
            ultralytics==8.3.175 transformers==4.53.2 streamlit==1.47.1
      - name: Checkout pinned MMSegmentation
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/open-mmlab/mmsegmentation.git /tmp/mmsegmentation
          git -C /tmp/mmsegmentation checkout --detach \
            c685fe6767c4cadf6b051983ca6208f1b9d1ccb8
          python -m pip install --no-deps -e /tmp/mmsegmentation
      - name: Run real MMSeg model.loss() regression tests
        env:
          EDGEGUARD_MMSEG_CHECKOUT: /tmp/mmsegmentation
        run: |
          pytest tests/unit/test_mmseg_real_training_step.py -v
      - name: Run local-first readiness and five-model CPU probe
        run: |
          python scripts/dev/validate_local_readiness.py \
            --workspace-root .local/linux-cpu-readiness \
            --profile linux-cpu \
            --mmseg-checkout /tmp/mmsegmentation
      - name: Run comprehensive real-codepath local closure
        run: |
          python scripts/dev/run_local_closure.py \
            --repository-root . \
            --output-root .local/linux-cpu-closure \
            --mmseg-checkout /tmp/mmsegmentation
      - name: Classify PIDNet and RT-DETR ONNX equivalence
        run: |
          python scripts/dev/run_onnx_equivalence.py \
            --mmseg-checkout /tmp/mmsegmentation \
            --output-root .local/linux-onnx-equivalence
      - name: Build and verify pre-Colab deployment evidence
        run: |
          python scripts/dev/run_precolab_stabilization.py \
            --expected-commit "$(git rev-parse HEAD)" \
            --closure-root .local/linux-cpu-closure \
            --equivalence-report .local/linux-onnx-equivalence/report.json \
            --output-root .local/linux-precolab
      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-framework-linux-cpu-evidence
          path: |
            .local/linux-cpu-readiness/evidence/
            .local/linux-cpu-closure/campaign_summary.json
            .local/linux-cpu-closure/reporting/*.zip
            .local/linux-onnx-equivalence/report.json
            .local/linux-precolab/*.zip
            .local/linux-precolab/precolab-readiness.json
          if-no-files-found: error
          retention-days: 14
